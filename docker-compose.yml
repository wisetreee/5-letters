version: '3.8'

services:
  backend:
    build: ./backend
    container_name: flask_backend
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: next_frontend
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "3000:3000"
