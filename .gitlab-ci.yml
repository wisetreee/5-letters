stages:
  - setup
  - lint
  - deploy

variables:
  DOCKER_IMAGE: "inferking/5-letters"
  DOCKER_TAG: "latest"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
    - backend/.venv/

# ---------- SETUP ----------

frontend_install_dependencies:
  stage: setup
  image: node:22.13
  script:
    - cd frontend
    - npm install
  artifacts:
    paths:
      - frontend/node_modules/

backend_install_dependencies:
  stage: setup
  image: python:3.11
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
  artifacts:
    paths:
      - backend/.venv/
    expire_in: 1 hour

# ---------- LINT ----------

frontend_lint:
  stage: lint
  image: node:22.13
  needs: ["frontend_install_dependencies"]
  script:
    - cd frontend
    - npm run lint

backend_lint:
  stage: lint
  image: python:3.11
  needs: ["backend_install_dependencies"]
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install black
    - black .
    - cd ..

# ---------- DEPLOY ----------

docker_build_and_push:
  stage: deploy
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    POSTGRES_USER: $POSTGRES_USER
    POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    POSTGRES_DB: $POSTGRES_DB
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker compose build
    - docker compose push
  after_script:
    - docker logout

deploy_to_vm:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh docker-cli
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh user1@176.109.104.150 "
        docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD &&
        docker pull $DOCKER_IMAGE:$DOCKER_TAG &&
        docker stop my-app || true &&
        docker rm my-app || true &&
        docker run -d --name my-app -p 4173:4173 \
        -e POSTGRES_USER=$POSTGRES_USER \
        -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
        -e POSTGRES_DB=$POSTGRES_DB \
        -e TOKEN=$TOKEN \
        -e URI=$URI \
        $DOCKER_IMAGE:$DOCKER_TAG
      "