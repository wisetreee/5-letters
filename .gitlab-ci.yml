stages:
  - setup
  - lint
  - deploy

variables:
  DOCKER_IMAGE: "your-dockerhub-username/your-app-name"
  DOCKER_TAG: "latest"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/
    - backend/.venv/

frontend_install_dependencies:
  stage: setup
  image: node:22.13
  script:
    - cd frontend
    - npm install
  artifacts:
    paths:
      - frontend/node_modules/

frontend_lint:
  stage: lint
  image: node:22.13
  needs: ["frontend_install_dependencies"]
  script:
    - cd frontend
    - npm run lint

backend_lint:
  stage: lint
  image: python:3.11
  before_script:
    - pip install --user virtualenv
    - python -m venv backend/.venv
    - source backend/.venv/bin/activate
    - pip install --upgrade pip
    - pip install black
  script:
    - cd backend
    - black .
    - cd ..

docker_build_and_push:
  stage: deploy
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  only:
    - main
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
  after_script:
    - docker logout